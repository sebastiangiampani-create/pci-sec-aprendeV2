name: Browser JavaScript check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Check current entry wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "fetch('app.html',{cache:'no-store'})" index.html
          grep -Fq "fetch('app.html',{cache:'no-store'})" app-safe.html
          if grep -Eq '\?v=20[0-9]{6}' index.html app-safe.html app.html app-core.html; then
            echo "No se permiten versiones manuales de cache en la entrada."
            exit 1
          fi

          for needle in             "src/v47-phase2-matrix.js"             "src/v59-phase2-annual-matrix.js"             "src/v48-institutional-layer.js"             "src/v71-lean-management.js"             "src/v71-simple-assignment-excel.js"             "src/v72-students-commissions.js"             "src/v73-management-home.js"             "src/v80-access-control.js"             "src/v85-access-panel.js"             "src/v91-coverage-core.js"             "src/v91-plans-coverage.js"             "src/v93-curricular-coverage-dashboard.js"; do
            grep -Fq "$needle" app.html
          done

          for forbidden in             "src/v78-asistencia.js"             "src/v79-regularidad.js"             "src/v83-attendance-course-report.js"             "src/v76-calificaciones.js"             "src/v77-boletines-cierres.js"             "src/v51-school-timetable-config.js"             "src/v60-availability-preferences.js"             "src/v65-annual-scheduler.js"             "src/v81-stable-scheduler.js"             "src/schedule-views.js"             "src/v69-tutoria-contents.js"; do
            if grep -Fq "$forbidden" app.html; then
              echo "Modulo fuera de alcance sigue activo: $forbidden"
              exit 1
            fi
          done

      - name: Run automated tests
        run: npm test

      - name: Check V91/V92 curricular contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const checks={
            'src/v47-phase2-matrix.js':['canEditGroup','editableSubjectsByOrientation','pci-phase2-groups-rendered','id="v28level"','loadCurriculum','subaxis','Trayectoria orientada'],
            'src/v80-access-control.js':['teacherEditSubjectsByOrientation','editableSubjectsByOrientation','coordinatorOrientation'],
            'src/v85-access-panel.js':['cargoSummary','v91-profile-menu','Ingresar con coordinaciones de Gestión','coordinatorOptions'],
            'src/v91-coverage-core.js':['universeForGroup','coverageForIds','offLevel','formatCoverage'],
            'src/v91-plans-coverage.js':['Agrupamiento · trayectoria','Agrupamiento · nivel','Planes del espacio','Criterios colegiados de evaluación','[1,2,3,4].map'],
            'src/v93-curricular-coverage-dashboard.js':['Panel de cobertura curricular','groupingLevelCoverage','formatTypeCoverage','v93d-space-list','valueMetric'],
            'src/v38-phase2-workspace.js':['PCIPlanCoverageV94','Aporte al','Dentro del','v95-coverage-table','data-back-space'],
            'src/v47-elective-plans.js':['PCIPlanCoverageV94','v94ElectiveCoverage','data-back-space'],
            'src/ui-navigation-consistency.js':['.screen>.back{display:inline-flex!important','z-index:9997','closeTransientLayers'],
            'src/v71-lean-management.js':['coordinations','Coordinación de área','Coordinación de orientación','SHIFTS'],
            'src/v80-access-control.js':['coordinatorAssignments','coordinatorEditableAreasByOrientation','groupsForOrientation']
          };
          for(const [file,needles] of Object.entries(checks)){
            const text=fs.readFileSync(file,'utf8');
            for(const needle of needles){
              if(!text.includes(needle))throw new Error(`${file}: falta contrato ${needle}`);
              console.log(`OK ${file}: ${needle}`);
            }
          }
          const zlib=require('zlib');
          const fgFiles=Array.from({length:9},(_,i)=>`fg-all-p${i+1}.txt`);
          const fgEncoded=fgFiles.map(x=>fs.readFileSync('data/curriculum_v96/'+x,'utf8').trim()).join('');
          const fg=JSON.parse(zlib.gunzipSync(Buffer.from(fgEncoded,'base64')).toString('utf8'));
          if(fg.length!==979)throw new Error(`Base FG V96 incorrecta: ${fg.length}`);
          const tutor=fg.filter(x=>x.subject==='Tutoría');
          if(tutor.length!==19||tutor.some(x=>![1,2].includes(Number(x.year))))throw new Error('Tutoría debe existir solo en 1.º y 2.º.');
          const byYear=Object.fromEntries([1,2,3,4,5].map(y=>[y,fg.filter(x=>Number(x.year)===y).length]));
          if(JSON.stringify(byYear)!==JSON.stringify({1:218,2:205,3:217,4:198,5:141}))throw new Error('Totales FG por nivel incorrectos: '+JSON.stringify(byYear));
          const foFiles=['fo_all.txt',...Array.from({length:10},(_,i)=>`fo_part${String(i+2).padStart(2,'0')}.txt`)];
          const foEncoded=foFiles.map(x=>fs.readFileSync('data/curriculum_v96/'+x,'utf8').trim()).join('');
          const foRaw=JSON.parse(zlib.gunzipSync(Buffer.from(foEncoded,'base64')).toString('utf8'));
          const fo=foRaw.slice(0,860);
          if(fo.length!==860)throw new Error(`Base FO V96 incorrecta: ${fo.length}`);
          const unique=new Set(fo.map(x=>JSON.stringify(x)));
          if(unique.size!==860)throw new Error(`FO contiene duplicados exactos: ${860-unique.size}`);
          const historia=fo.filter(x=>/historia.*orientad/i.test(String(x[2]||''))).length;
          const tecnologia=fo.filter(x=>/tecnolog/i.test(String(x[2]||''))).length;
          if(historia!==98||tecnologia!==91)throw new Error(`Historia/Tecnología FO incorrectas: ${historia}/${tecnologia}`);
          console.log(`OK bases V96: FG ${fg.length} · FO ${fo.length}`);
          NODE

      - name: Check protected PCI core remains wired
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.html','utf8');
          for(const needle of ['src/v47-phase2-matrix.js','src/v59-phase2-annual-matrix.js','src/v48-institutional-layer.js']){
            if(!app.includes(needle))throw new Error(`app.html: falta ${needle}`);
          }
          console.log('OK: Mapa y Desarrollo Curricular permanecen conectados.');
          NODE
