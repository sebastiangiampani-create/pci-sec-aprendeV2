name: Browser JavaScript check

on:
  push:
    branches:
      - main
      - feature/v95-coordinations-subtle-plan-detail
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0)

      - name: Check current entry wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "fetch('app.html',{cache:'no-store'})" index.html
          grep -Fq "fetch('app.html',{cache:'no-store'})" app-safe.html
          if grep -Eq '\?v=20[0-9]{6}' index.html app-safe.html app.html app-core.html; then
            echo "No se permiten versiones manuales de cache en la entrada."
            exit 1
          fi

          for needle in             "src/v47-phase2-matrix.js"             "src/v59-phase2-annual-matrix.js"             "src/v48-institutional-layer.js"             "src/v71-lean-management.js"             "src/v71-simple-assignment-excel.js"             "src/v72-students-commissions.js"             "src/v73-management-home.js"             "src/v80-access-control.js"             "src/v85-access-panel.js"             "src/v91-coverage-core.js"             "src/v91-plans-coverage.js"             "src/v93-curricular-coverage-dashboard.js"; do
            grep -Fq "$needle" app.html
          done

          for forbidden in             "src/v78-asistencia.js"             "src/v79-regularidad.js"             "src/v83-attendance-course-report.js"             "src/v76-calificaciones.js"             "src/v77-boletines-cierres.js"             "src/v51-school-timetable-config.js"             "src/v60-availability-preferences.js"             "src/v65-annual-scheduler.js"             "src/v81-stable-scheduler.js"             "src/schedule-views.js"; do
            if grep -Fq "$forbidden" app.html; then
              echo "Modulo fuera de alcance sigue activo: $forbidden"
              exit 1
            fi
          done

      - name: Run automated tests
        run: npm test

      - name: Check V91/V92 curricular contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const checks={
            'src/v47-phase2-matrix.js':['canEditGroup','editableSubjectsByOrientation','pci-phase2-groups-rendered'],
            'src/v80-access-control.js':['teacherEditSubjectsByOrientation','editableSubjectsByOrientation','coordinatorOrientation'],
            'src/v85-access-panel.js':['cargoSummary','v91-profile-menu','Ingresar con coordinaciones de Gestión','coordinatorOptions'],
            'src/v91-coverage-core.js':['universeForGroup','coverageForIds','offLevel','formatCoverage'],
            'src/v91-plans-coverage.js':['Agrupamiento · trayectoria','Agrupamiento · nivel','Planes del espacio','Criterios colegiados de evaluación','[1,2,3,4].map'],
            'src/v93-curricular-coverage-dashboard.js':['Panel de cobertura curricular','groupingLevelCoverage','formatTypeCoverage','v93d-space-list','valueMetric'],
            'src/v38-phase2-workspace.js':['PCIPlanCoverageV94','Aporte al','Dentro del','v95-coverage-table','data-back-space'],
            'src/v47-elective-plans.js':['PCIPlanCoverageV94','v94ElectiveCoverage','data-back-space'],
            'src/ui-navigation-consistency.js':['.screen>.back{display:inline-flex!important','z-index:9997','closeTransientLayers'],
            'src/v71-lean-management.js':['coordinations','Coordinación de área','Coordinación de orientación','SHIFTS'],
            'src/v80-access-control.js':['coordinatorAssignments','coordinatorEditableAreasByOrientation','groupsForOrientation']
          };
          for(const [file,needles] of Object.entries(checks)){
            const text=fs.readFileSync(file,'utf8');
            for(const needle of needles){
              if(!text.includes(needle))throw new Error(`${file}: falta contrato ${needle}`);
              console.log(`OK ${file}: ${needle}`);
            }
          }
          const data=JSON.parse(fs.readFileSync('data/contenidos-prescriptos-fg.json','utf8'));
          if(!Array.isArray(data.rows)||data.rows.length<1000)throw new Error('Base prescripta insuficiente.');
          if(!data.rows.every(x=>x.year>=1&&x.year<=5&&x.subject&&x.text))throw new Error('Base prescripta sin año/materia/contenido.');
          console.log(`OK base prescripta: ${data.rows.length} contenidos`);
          NODE

      - name: Check protected PCI core remains wired
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.html','utf8');
          for(const needle of ['src/v47-phase2-matrix.js','src/v59-phase2-annual-matrix.js','src/v48-institutional-layer.js']){
            if(!app.includes(needle))throw new Error(`app.html: falta ${needle}`);
          }
          console.log('OK: Mapa y Desarrollo Curricular permanecen conectados.');
          NODE
